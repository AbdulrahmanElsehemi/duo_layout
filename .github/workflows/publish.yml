name: Publish to pub.dev

# A version tag (v0.5.1) publishes that version, with no password: pub.dev
# trusts this workflow once automated publishing is turned on in the
# package's Admin tab (repository AbdulrahmanElsehemi/duo_layout, tag
# pattern v{{version}}). The very first version has to be published by hand.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The token pub.dev checks the workflow by.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Sets up the pub.dev credentials from the token.
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter pub publish --force
